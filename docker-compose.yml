services:
  web:
    image: ghcr.io/collettaa/site-caicara:latest
    environment:
      - NODE_ENV=production
      - GOOGLE_PLACES_API_KEY=${GOOGLE_PLACES_API_KEY}
      - GOOGLE_PLACE_ID=${GOOGLE_PLACE_ID}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - EVOLUTION_URL=${EVOLUTION_URL}
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY}
      - EVOLUTION_INSTANCE=${EVOLUTION_INSTANCE}
      - AVISO_WHATSAPP=${AVISO_WHATSAPP}
      - AULAO_LISTA_KEY=${AULAO_LISTA_KEY}
      # Pix do Aulão Rosa / aula avulsa (conta Asaas de sempre). URL com padrão: vazia quebraria o Aulão
      - ASAAS_API_KEY=${ASAAS_API_KEY}
      - ASAAS_URL=${ASAAS_URL:-https://api.asaas.com/v3}
      # Loja: conta Asaas própria (sandbox no teste, produção depois)
      - LOJA_ASAAS_API_KEY=${LOJA_ASAAS_API_KEY}
      - LOJA_ASAAS_URL=${LOJA_ASAAS_URL}
      # Loja: token do webhook do Asaas (o mesmo cadastrado no painel)
      - ASAAS_WEBHOOK_TOKEN=${ASAAS_WEBHOOK_TOKEN}
      # Loja: senha do /admin e segredo que assina o cookie da sessão
      - ADMIN_SENHA=${ADMIN_SENHA}
      - ADMIN_COOKIE_SECRET=${ADMIN_COOKIE_SECRET}
      # Loja: endereço público, usado nos links do pedido e no retorno do pagamento
      - SITE_URL=${SITE_URL:-https://caicara.store}
    volumes:
      - site_caicara_data:/app/data
    networks:
      - CaicaraNet
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/robots.txt').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      restart_policy:
        condition: on-failure
      labels:
        - traefik.enable=true
        - traefik.docker.network=CaicaraNet
        - traefik.http.routers.caicara-site.entrypoints=websecure
        - traefik.http.routers.caicara-site.rule=Host(`caicara.store`)
        - traefik.http.routers.caicara-site.tls=true
        - traefik.http.routers.caicara-site.tls.certresolver=letsencryptresolver
        - traefik.http.routers.caicara-site.service=caicara-site
        - traefik.http.routers.caicara-site-www.entrypoints=websecure
        - traefik.http.routers.caicara-site-www.rule=Host(`www.caicara.store`)
        - traefik.http.routers.caicara-site-www.tls=true
        - traefik.http.routers.caicara-site-www.tls.certresolver=letsencryptresolver
        - traefik.http.routers.caicara-site-www.service=caicara-site
        - traefik.http.services.caicara-site.loadbalancer.server.port=3000
        - traefik.http.services.caicara-site.loadbalancer.passHostHeader=true

volumes:
  site_caicara_data:

networks:
  CaicaraNet:
    external: true
    name: CaicaraNet
